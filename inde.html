<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
撒迦利亞異象翻牌對對看
</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:

"Noto Sans TC",
"Microsoft JhengHei",
sans-serif;

background:

linear-gradient(
#90caf9,
#fff
);

text-align:center;

color:#333;

}




.container{

max-width:750px;

margin:auto;

padding:15px;

}



h1{

color:#8b4513;

}



.card{

background:white;

border-radius:25px;

padding:20px;

margin:15px 0;

box-shadow:

0 5px 15px rgba(0,0,0,.15);

}




button{


border:none;

border-radius:30px;

padding:15px 25px;

font-size:18px;

margin:8px;

background:#ffca28;

cursor:pointer;


}



button:hover{

background:#ffd54f;

}




.level-btn{


width:80%;


}



.easy{

background:#81c784;

}



.normal{

background:#64b5f6;

}



.hard{

background:#e57373;

}



.hidden{

display:none;

}




.info{

font-size:20px;

line-height:1.8;

}



.game-board{


display:grid;


gap:12px;


justify-content:center;


margin-top:20px;


}




.memory-card{


width:80px;

height:100px;


background:#1565c0;


border-radius:15px;


display:flex;


align-items:center;


justify-content:center;


font-size:40px;


cursor:pointer;


color:white;


transition:.3s;


}



.memory-card.open{


background:white;

color:#333;


transform:rotateY(180deg);


}



.memory-card.match{


background:#81c784;

}




.score{


font-size:22px;

color:#d2691e;


}




.result{


font-size:22px;

}



.badge{


font-size:60px;


}



footer{

color:#777;

margin-top:30px;

}


</style>


</head>



<body>



<div class="container">



<h1>

🌟 撒迦利亞異象翻牌對對看 🌟

</h1>



<div id="home" class="card">


<div style="font-size:70px">

📖🕯️

</div>



<h2>

撒迦利亞書 1–8章

</h2>



<p class="info">


找出神給撒迦利亞的異象，


<br>

學習神對百姓的愛與計畫。


</p>




<h3>

選擇挑戰難度

</h3>



<button class="level-btn easy"

onclick="startGame('easy')">

🟢 初級

<br>

6組配對

</button>



<br>



<button class="level-btn normal"

onclick="startGame('normal')">

🟡 中級

<br>

10組配對

</button>



<br>



<button class="level-btn hard"

onclick="startGame('hard')">

🔴 高級

<br>

15組配對

</button>



</div>







<div id="game" class="hidden">



<div class="card">


<div class="score">

⭐ 分數：

<span id="score">

0

</span>

</div>



<div>

⏱️ 時間：

<span id="time">

0

</span>

秒

</div>



<div>

🏅 找到：

<span id="found">

0

</span>

組

</div>


</div>





<div id="board"

class="game-board">

</div>





<button onclick="restart()">

🔄 重新開始

</button>



</div>








<div id="result"

class="card hidden">


<div class="badge">

🏆

</div>



<h2>

🎉 完成冒險！

</h2>



<p class="result">

你認識了撒迦利亞書1-8章的重要異象！

</p>



<p id="verse">

</p>



<button onclick="backHome()">

回首頁

</button>


</div>






<footer>

主日學教材｜撒迦利亞書

</footer>



</div>

<script>


// =======================
// 遊戲資料
// 撒迦利亞書 1-8章
// =======================


const data = {


easy:[


["🐴","四匹馬"],
["🐴","神巡視全地"],


["🕯️","金燈台"],
["🕯️","靠神的靈"],


["👕","約書亞祭司"],
["👕","神潔淨罪"],


["🏙️","量耶路撒冷"],
["🏙️","神保護城市"],


["📜","飛行書卷"],
["📜","神除去罪惡"],


["🙏","真心敬拜"],
["🙏","愛神愛人"]


],



normal:[


["🐴","四匹馬"],
["🐴","神看顧全地"],


["🔨","四角四匠"],
["🔨","神勝過仇敵"],


["📏","準繩量城"],
["📏","神建造耶路撒冷"],


["👕","約書亞祭司"],
["👕","神除去罪污"],


["🕯️","金燈台"],
["🕯️","不是靠勢力"],


["📜","飛行書卷"],
["📜","神審判罪惡"],


["⚱️","量器中的婦人"],
["⚱️","除去邪惡"],


["🚗","四輛戰車"],
["🚗","神掌管列國"],


["🏛️","重建聖殿"],
["🏛️","敬拜神"],


["❤️","回轉神"],
["❤️","神重新賜福"]


],




hard:[


["🐴","第一異象：四匹馬"],
["🐴","神巡視全地"],


["🔨","第二異象：四角四匠"],
["🔨","神拆毀敵人力量"],


["📏","第三異象：準繩量城"],
["📏","神保護耶路撒冷"],


["👕","第四異象：約書亞"],
["👕","神潔淨大祭司"],


["🕯️","第五異象：金燈台"],
["🕯️","不是倚靠勢力"],


["📜","第六異象：飛行書卷"],
["📜","神審判罪惡"],


["⚱️","第七異象：量器婦人"],
["⚱️","除去邪惡"],


["🚗","第八異象：四輛戰車"],
["🚗","神掌管萬國"],


["👤","所羅巴伯"],
["👤","靠神完成工作"],


["📖","撒迦利亞4:6"],
["📖","乃是倚靠我的靈"],


["🙏","真正禁食"],
["🙏","行公平憐憫"],


["🏠","神住在百姓中"],
["🏠","神恢復祂的家"],


["🌱","重新結果子"],
["🌱","神賜下祝福"],


["😊","耶路撒冷歡樂"],
["😊","神使百姓喜樂"],


["⭐","神的應許"],
["⭐","神永不忘記"]


]


};





// =======================
// 變數
// =======================


let cards=[];

let firstCard=null;

let secondCard=null;

let lock=false;


let score=0;

let found=0;

let total=0;


let timer=0;

let timerID=null;


let currentLevel="easy";





// =======================
// 開始遊戲
// =======================


function startGame(level){


currentLevel=level;


document.getElementById("home")
.style.display="none";


document.getElementById("game")
.style.display="block";



createCards(level);


}





// =======================
// 建立牌卡
// =======================


function createCards(level){



clearInterval(timerID);


timer=0;

score=0;

found=0;



document.getElementById("score")
.innerHTML=0;


document.getElementById("found")
.innerHTML=0;


document.getElementById("time")
.innerHTML=0;




let source=data[level];



let pair=[];



for(let i=0;i<source.length;i+=2){


let id=i/2;


pair.push({

id:id,

content:source[i][0]

});



pair.push({

id:id,

content:source[i+1][1]

});


}



cards=shuffle(pair);



total=cards.length/2;




let board=document.getElementById("board");


board.innerHTML="";



if(cards.length<=12){


board.style.gridTemplateColumns="repeat(3,80px)";


}

else if(cards.length<=20){


board.style.gridTemplateColumns="repeat(4,80px)";


}

else{


board.style.gridTemplateColumns="repeat(5,80px)";


}






cards.forEach(function(card){


let div=document.createElement("div");


div.className="memory-card";


div.dataset.id=card.id;


div.innerHTML="❓";



div.onclick=function(){


flipCard(div,card);


};



board.appendChild(div);



});



timerID=setInterval(function(){


timer++;


document.getElementById("time")
.innerHTML=timer;


},1000);



}







// =======================
// 洗牌
// =======================


function shuffle(array){


return array.sort(()=>Math.random()-0.5);


}







// =======================
// 翻牌
// =======================


function flipCard(element,card){



if(lock)
return;



if(element.classList.contains("open"))
return;



element.classList.add("open");


element.innerHTML=card.content;




if(!firstCard){


firstCard={

element:element,

card:card

};


return;


}



secondCard={

element:element,

card:card

};



checkMatch();


}








// =======================
// 判斷配對
// =======================


function checkMatch(){



if(
firstCard.card.id ===
secondCard.card.id

){



firstCard.element
.classList.add("match");


secondCard.element
.classList.add("match");



score+=10;


found++;



document.getElementById("score")
.innerHTML=score;



document.getElementById("found")
.innerHTML=found;



firstCard=null;

secondCard=null;



if(found===total){


finishGame();


}



}



else{



lock=true;



setTimeout(function(){


firstCard.element.classList.remove("open");

secondCard.element.classList.remove("open");



firstCard.element.innerHTML="❓";

secondCard.element.innerHTML="❓";



firstCard=null;

secondCard=null;


lock=false;



},800);



}



}








// =======================
// 完成
// =======================


function finishGame(){


clearInterval(timerID);



document.getElementById("game")
.style.display="none";


document.getElementById("result")
.style.display="block";



let message="";



if(score>=150){


message="🏅 異象大師！你非常熟悉撒迦利亞書！";


}

else if(score>=80){


message="🕯 信心探索者！繼續認識神的話語！";


}

else{


message="🌱 神喜歡你的學習！";


}





document.getElementById("verse")
.innerHTML=

message+

"<br><br>📖 撒迦利亞書4:6<br><br>"

+

"不是倚靠勢力，不是倚靠才能，乃是倚靠我的靈。";



}







// =======================
// 重新開始
// =======================


function restart(){


createCards(currentLevel);


}






function backHome(){


document.getElementById("result")
.style.display="none";


document.getElementById("home")
.style.display="block";


}



</script>


</body>

</html>
