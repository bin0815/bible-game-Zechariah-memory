卡牌區
=========================

#board{

/*
自動依螢幕排列

repeat(
auto-fit,

max-width:850px;

}





.card{

}





/*
卡背
*/

.cover{


position:absolute;

inset:0;


background:#1565c0;


border-radius:18px;


display:flex;

align-items:center;

justify-content:center;


font-size:

clamp(35px,8vw,70px);

}




/*
圖片面

預設隱藏

*/

.face{


position:absolute;

inset:0;


background:white;


border-radius:18px;


border:

3px solid #ffca28;


display:none;


align-items:center;

justify-content:center;

flex-direction:column;

}





.card.open .cover{

display:none;

}



.card.open .face{

display:flex;

}




.icon{


font-size:

clamp(35px,8vw,65px);

}



.name{


font-size:

clamp(12px,3vw,20px);


margin-top:8px;

}





.card.correct .face{


background:#c8e6c9;


animation:

pop .6s;

}



@keyframes pop{


50%{

transform:scale(1.1);

}


}





.lesson{


background:#fff3cd;

border-radius:20px;

padding:15px;

font-size:18px;

line-height:1.8;

// =============================

// =============================
// 開始遊戲
// =============================

function startGame(lv){

level = lv;

document.getElementById("home").classList.add("hide");
document.getElementById("game").classList.remove("hide");

newGame();

}


// =============================
// 新遊戲
// =============================

function newGame(){

clearInterval(timer);

score = 0;
found = 0;
seconds = 0;

document.getElementById("score").textContent = 0;
document.getElementById("found").textContent = 0;
document.getElementById("time").textContent = 0;

document.getElementById("lesson").innerHTML = "";

deck = [];

CARD_DATA[level].forEach(card=>{

deck.push({...card});
deck.push({...card});

});

shuffle(deck);

buildBoard();

timer = setInterval(()=>{

seconds++;

document.getElementById("time").textContent = seconds;

},1000);

}


// =============================
// 洗牌
// =============================

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

}
