<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
撒迦利亞書大冒險 v1.2
</title>

<style>

*{
 box-sizing:border-box;
 font-family:
 "Noto Sans TC",
 "Microsoft JhengHei",
 sans-serif;
}


body{

 margin:0;

 min-height:100vh;

 background:
 linear-gradient(
 180deg,
 #fff3c4,
 #ffe0b2
 );

 display:flex;

 justify-content:center;

 align-items:center;

}


.game{

 width:95%;

 max-width:620px;

 text-align:center;

}


h1{

 color:#8b4513;

 font-size:32px;

 margin:10px;

}


.subtitle{

 color:#5d4037;

 font-size:18px;

 margin-bottom:15px;

}


.panel{

 background:white;

 border-radius:20px;

 padding:20px;

 box-shadow:
 0 5px 15px rgba(0,0,0,.18);

}


button{

 border:none;

 border-radius:30px;

 padding:14px 30px;

 margin:8px;

 font-size:20px;

 cursor:pointer;

 background:#ff9800;

 color:white;

}


button:hover{

 background:#f57c00;

}


.easy{

 background:#66bb6a;

}


.normal{

 background:#42a5f5;

}


.hard{

 background:#ef5350;

}



.hidden{

 display:none;

}



/* 遊戲區 */


.info{

 display:flex;

 justify-content:space-around;

 font-size:18px;

 margin-bottom:15px;

}


.board{

 display:grid;

 gap:12px;

}


.board.easy{

 grid-template-columns:
 repeat(3,1fr);

}


.board.normal{

 grid-template-columns:
 repeat(3,1fr);

}


.board.hard{

 grid-template-columns:
 repeat(3,1fr);

}



.card{

 height:110px;

 background:#795548;

 border-radius:15px;

 display:flex;

 align-items:center;

 justify-content:center;

 font-size:45px;

 color:white;

 cursor:pointer;

 transition:.3s;

}


.card.open{

 background:#fff8e1;

 color:#333;

}


.card.done{

 background:#81c784;

}


.message{

 margin-top:20px;

 padding:15px;

 border-radius:15px;

 background:#fff3e0;

 color:#6a1b9a;

 font-size:20px;

 line-height:1.6;

}


@media(max-width:400px){

.card{

 height:85px;

 font-size:35px;

}

h1{

 font-size:26px;

}

}


</style>

</head>


<body>


<div class="game">


<!-- 首頁 -->

<div id="home">


<h1>

🐴 撒迦利亞書<br>
大冒險 v1.2

</h1>


<div class="subtitle">

發現神給撒迦利亞的異象！

</div>


<div class="panel">


<h2>

🃏 記憶對對碰

</h2>


<p>

請選擇挑戰難度

</p>


<button
class="easy"
onclick="startGame('easy')">

🌱 簡單<br>
6張卡

</button>


<button
class="normal"
onclick="startGame('normal')">

⭐ 普通<br>
12張卡

</button>


<button
class="hard"
onclick="startGame('hard')">

🔥 挑戰<br>
18張卡

</button>


</div>


</div>





<!-- 遊戲 -->

<div id="gamePage" class="hidden">


<h1>

🃏 記憶對對碰

</h1>


<div class="panel">


<div class="info">

<div>

⭐ 分數：
<span id="score">
0
</span>

</div>


<div>

🔄 次數：
<span id="count">
0
</span>

</div>


</div>


<div id="board"
class="board">

</div>


<button onclick="restartGame()">

重新開始

</button>


<button onclick="backHome()">

返回首頁

</button>


<div id="message"
class="message hidden">

</div>


</div>


</div>


</div>


<script>


// ================================
// 撒迦利亞異象資料
// ================================


const themes = [

{
icon:"🐴",
name:"馬匹",
text:"神看顧祂的百姓",
verse:"撒迦利亞書 1章"
},

{
icon:"📏",
name:"量繩",
text:"神保護耶路撒冷",
verse:"撒迦利亞書 2章"
},

{
icon:"👕",
name:"大祭司",
text:"神除去罪惡",
verse:"撒迦利亞書 3章"
},

{
icon:"🕯️",
name:"金燈臺",
text:"不是倚靠勢力，乃是倚靠神的靈",
verse:"撒迦利亞書 4:6"
},

{
icon:"📜",
name:"飛行書卷",
text:"神喜愛公義",
verse:"撒迦利亞書 5章"
},

{
icon:"👑",
name:"君王",
text:"和平的君王",
verse:"撒迦利亞書 9章"
},

{
icon:"🕊️",
name:"橄欖樹",
text:"神賜下恩典",
verse:"撒迦利亞書 4章"
},

{
icon:"🏛️",
name:"聖殿",
text:"神與百姓同在",
verse:"撒迦利亞書 6章"
},

{
icon:"⭐",
name:"盼望",
text:"神的應許永不改變",
verse:"撒迦利亞書"
}

];



// ================================
// 遊戲變數
// ================================


let level="normal";

let cards=[];

let firstCard=null;

let secondCard=null;

let lock=false;

let score=0;

let count=0;

let matched=0;

let totalPairs=0;



// ================================
// 開始遊戲
// ================================


function startGame(mode){


level=mode;


document
.getElementById("home")
.classList.add("hidden");


document
.getElementById("gamePage")
.classList.remove("hidden");



createCards();


}



// ================================
// 建立卡片
// ================================


function createCards(){


let amount;



if(level==="easy"){

amount=3;

}


else if(level==="normal"){

amount=6;

}


else{

amount=9;

}



totalPairs=amount;



let selected=
themes.slice(0,amount);



cards=[];



selected.forEach(item=>{


// 每一組建立完全相同圖案兩張


cards.push({

id:item.name,

icon:item.icon,

name:item.name,

text:item.text,

verse:item.verse

});


cards.push({

id:item.name,

icon:item.icon,

name:item.name,

text:item.text,

verse:item.verse

});


});



cards=shuffle(cards);



showCards();


}



// ================================
// 洗牌
// ================================


function shuffle(array){


return array.sort(
()=>Math.random()-0.5
);


}




// ================================
// 顯示卡片
// ================================


function showCards(){


const board=
document.getElementById("board");


board.innerHTML="";


board.className=
"board "+level;



cards.forEach(card=>{


let div=
document.createElement("div");


div.className="card";


div.dataset.id=
card.id;


div.dataset.icon=
card.icon;


div.dataset.name=
card.name;


div.dataset.text=
card.text;


div.dataset.verse=
card.verse;



div.innerHTML="❓";



div.onclick=function(){

flipCard(div);

};



board.appendChild(div);


});


}




// ================================
// 翻牌
// ================================


function flipCard(card){


if(lock)
return;


if(card.classList.contains("open"))
return;


if(card.classList.contains("done"))
return;



card.classList.add("open");


card.innerHTML=
card.dataset.icon;



if(!firstCard){


firstCard=card;


return;


}



secondCard=card;


count++;


document
.getElementById("count")
.innerHTML=count;



checkMatch();



}



// ================================
// 判斷配對
// ================================


function checkMatch(){


lock=true;



if(
firstCard.dataset.id===
secondCard.dataset.id
){



firstCard.classList.add("done");

secondCard.classList.add("done");



score+=10;


matched++;



document
.getElementById("score")
.innerHTML=score;



showMessage(

"🎉 找到了！<br><br>"+
firstCard.dataset.icon+
" "+
firstCard.dataset.name+
"<br>"+
firstCard.dataset.text+
"<br>"+
firstCard.dataset.verse

);



resetTurn();



if(matched===totalPairs){


setTimeout(()=>{

showMessage(

"🏆 恭喜完成全部異象！<br><br>"+
"神記念祂的百姓，<br>"+
"也與我們同在。"

);


},600);


}



}
else{



setTimeout(()=>{


firstCard.classList.remove("open");

secondCard.classList.remove("open");


firstCard.innerHTML="❓";

secondCard.innerHTML="❓";


resetTurn();



},900);



}



}




// ================================
// 重置翻牌
// ================================


function resetTurn(){


firstCard=null;

secondCard=null;

lock=false;


}

// ================================
// 顯示訊息
// ================================


function showMessage(text){


const box=
document.getElementById("message");


box.innerHTML=text;


box.classList.remove("hidden");



setTimeout(()=>{


box.classList.add("hidden");


},3500);



}





// ================================
// 重新開始
// ================================


function restartGame(){


score=0;

count=0;

matched=0;

firstCard=null;

secondCard=null;

lock=false;



document
.getElementById("score")
.innerHTML=0;


document
.getElementById("count")
.innerHTML=0;



createCards();



document
.getElementById("message")
.classList.add("hidden");


}





// ================================
// 返回首頁
// ================================


function backHome(){


document
.getElementById("gamePage")
.classList.add("hidden");


document
.getElementById("home")
.classList.remove("hidden");



score=0;

count=0;

matched=0;


}



// ================================
// 防止重新整理空白
// ================================


window.onload=function(){


document
.getElementById("home")
.classList.remove("hidden");


document
.getElementById("gamePage")
.classList.add("hidden");


};



</script>


</body>

</html>
