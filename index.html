<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>撒迦利亞書記憶對對碰</title>

<style>

*{
    box-sizing:border-box;
    font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:
    linear-gradient(
        180deg,
        #fff3c4,
        #ffe7a3
    );
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    width:95%;
    max-width:600px;
    text-align:center;
}

h1{
    color:#8b4513;
    font-size:32px;
    margin:10px;
}

.subtitle{
    font-size:18px;
    color:#5d4037;
}

.panel{
    background:white;
    border-radius:20px;
    padding:15px;
    margin-top:15px;
    box-shadow:
    0 5px 15px rgba(0,0,0,.15);
}


.info{
    display:flex;
    justify-content:space-around;
    font-size:18px;
    margin-bottom:10px;
}


.board{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

}


.card{

    height:110px;

    background:#795548;

    border-radius:15px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:45px;

    color:white;

    transition:.3s;

    transform-style:preserve-3d;

}


.card:hover{
    transform:scale(1.05);
}


.card.open{

    background:#fff8e1;

    color:#333;

}


.card.done{

    background:#81c784;

    color:white;

}


button{

    margin-top:15px;

    padding:12px 30px;

    border:none;

    border-radius:30px;

    background:#ff9800;

    color:white;

    font-size:18px;

    cursor:pointer;

}


button:hover{

    background:#f57c00;

}



.message{

    display:none;

    font-size:20px;

    color:#6a1b9a;

    line-height:1.6;

}



@media(max-width:400px){

.card{

height:90px;

font-size:38px;

}

h1{

font-size:26px;

}

}


</style>

</head>


<body>


<div class="game">


<h1>
🐴 撒迦利亞書<br>
記憶對對碰
</h1>


<div class="subtitle">

找出神給撒迦利亞的異象！

</div>


<div class="panel">


<div class="info">

<div>
⭐ 分數：
<span id="score">
0
</span>
</div>


<div>
🔄 次數：
<span id="count">
0
</span>
</div>


</div>



<div class="board" id="board">

</div>



<button onclick="restart()">

重新開始

</button>



<div class="message" id="message">

🎉 恭喜完成！<br><br>

你發現了撒迦利亞的異象！<br>

神記念祂的百姓，<br>
也與我們同在。<br><br>


📖 撒迦利亞書 4:6<br>

「不是倚靠勢力，不是倚靠才能，
乃是倚靠我的靈方能成事。」

</div>


</div>


</div>



<script>


// ===========================
// 撒迦利亞卡片資料
// ===========================


const cardsData=[


{
id:1,
icon:"🐴",
text:"馬匹",
info:"神看顧祂的百姓"
},


{
id:1,
icon:"📖",
text:"第一異象",
info:"撒迦利亞書1章"
},



{
id:2,
icon:"📏",
text:"量繩",
info:"神保護耶路撒冷"
},


{
id:2,
icon:"🏙️",
text:"耶路撒冷",
info:"神與百姓同住"
},



{
id:3,
icon:"👕",
text:"大祭司",
info:"神除去罪惡"
},


{
id:3,
icon:"✨",
text:"潔淨",
info:"神赦免祂的百姓"
},



{
id:4,
icon:"🕯️",
text:"金燈臺",
info:"靠神的靈"
},


{
id:4,
icon:"💡",
text:"聖靈",
info:"不是靠自己"
},



{
id:5,
icon:"📜",
text:"飛行書卷",
info:"神喜愛公義"
},


{
id:5,
icon:"⚖️",
text:"公義",
info:"神審判罪惡"
},



{
id:6,
icon:"👑",
text:"君王",
info:"和平的君王"
},


{
id:6,
icon:"🕊️",
text:"彌賽亞",
info:"神應許救主"
}



];



let first=null;

let second=null;

let lock=false;

let score=0;

let count=0;

let complete=0;



function shuffle(array){

return array.sort(
()=>Math.random()-0.5
);

}



function createBoard(){


const board=
document.getElementById("board");


board.innerHTML="";


shuffle([...cardsData])
.forEach(card=>{


let div=
document.createElement("div");


div.className="card";


div.dataset.id=
card.id;


div.dataset.icon=
card.icon;


div.dataset.info=
card.info;


div.innerHTML="❓";


div.onclick=
()=>flip(div);



board.appendChild(div);


});


}



function flip(card){


if(lock)
return;


if(card.classList.contains("open"))
return;


if(card.classList.contains("done"))
return;



card.classList.add("open");


card.innerHTML=
card.dataset.icon;



if(!first){

first=card;

return;

}



second=card;

count++;

document.getElementById("count")
.innerHTML=count;



check();


}
// ===========================
// 判斷配對
// ===========================


function check(){


lock=true;



if(first.dataset.id===second.dataset.id){


    first.classList.add("done");

    second.classList.add("done");


    score+=10;


    document.getElementById("score")
    .innerHTML=score;



    complete++;


    showHint(
        "🎉 答對了！\n"+
        first.dataset.info
    );



    resetTurn();



    if(complete===6){

        setTimeout(()=>{

            document.getElementById("message")
            .style.display="block";


        },500);

    }



}
else{


    setTimeout(()=>{


        first.classList.remove("open");

        second.classList.remove("open");

        first.innerHTML="❓";

        second.innerHTML="❓";


        resetTurn();


    },900);



}



}





// ===========================
// 小提示
// ===========================


function showHint(text){


let old=
document.getElementById("hint");


if(old)
old.remove();



let div=
document.createElement("div");


div.id="hint";


div.style.marginTop="10px";

div.style.color="#795548";

div.style.fontSize="18px";

div.innerText=text;



document.querySelector(".panel")
.appendChild(div);



setTimeout(()=>{

div.remove();

},2500);



}





// ===========================
// 重置翻牌狀態
// ===========================


function resetTurn(){


first=null;

second=null;

lock=false;


}





// ===========================
// 重新開始
// ===========================


function restart(){


score=0;

count=0;

complete=0;


document.getElementById("score")
.innerHTML=0;


document.getElementById("count")
.innerHTML=0;


document.getElementById("message")
.style.display="none";


createBoard();


}





// ===========================
// 啟動遊戲
// ===========================


createBoard();



</script>


</body>

</html>
