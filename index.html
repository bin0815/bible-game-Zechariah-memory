body{

margin:0;

"Noto Sans TC",

margin:auto;

padding:15px;

}



h1{

font-size:clamp(26px,6vw,42px);

color:#8b4513;

}



.box{

background:white;

border-radius:25px;

padding:20px;

margin:20px 0;

box-shadow:
0 5px 15px rgba(0,0,0,.15);

}



button{

border:0;

border-radius:30px;

padding:15px 25px;

font-size:20px;

margin:8px;

.easy{

background:#81c784;

.normal{

.hard{

/* 遊戲資訊 */

.status{

display:flex;

justify-content:space-around;

flex-wrap:wrap;

font-size:20px;

}





/* 卡牌區 */

#board{


display:grid;


/*
自動依螢幕寬度調整
*/

grid-template-columns:

repeat(
auto-fit,
minmax(75px,1fr)
);


gap:12px;


width:100%;

max-width:850px;

margin:auto;


}



/* 卡牌 */


.memory-card{


position:relative;


aspect-ratio:3/4;


cursor:pointer;


}



/* 卡背 */

.cover{


position:absolute;


width:100%;

height:100%;


background:#1565c0;


border-radius:15px;


display:flex;

align-items:center;

justify-content:center;


font-size:clamp(35px,8vw,65px);


color:white;


}



/* 卡片內容 */


.content{


position:absolute;


width:100%;

height:100%;


background:white;


border-radius:15px;


border:3px solid #ffca28;


display:none;


align-items:center;


justify-content:center;


flex-direction:column;


}



.content .icon{


font-size:

clamp(30px,8vw,65px);

}



.content .name{


font-size:

clamp(12px,3vw,20px);


margin-top:8px;

}




.memory-card.open .cover{

display:none;

}



.memory-card.open .content{

display:flex;

}



.memory-card.match .content{

background:#c8e6c9;

animation:

success .8s;

}




@keyframes success{


50%{

transform:scale(1.1);

}


}





.lesson{


background:#fff3cd;

border-radius:20px;

padding:15px;

font-size:18px;

line-height:1.8;


}



.badge{

font-size:70px;

}

// ================================
// 遊戲變數
// ================================


let level="easy";

let cards=[];

let first=null;

let second=null;

let lock=false;

let found=0;

let score=0;

let time=0;

let timer=null;





// ================================
// 開始遊戲
// ================================


function startGame(l){


level=l;


document.getElementById("home")
.classList.add("hidden");


document.getElementById("game")
.classList.remove("hidden");



createCards();


}







function createCards(){


clearInterval(timer);


found=0;

score=0;

time=0;


document.getElementById("score").innerHTML=0;

document.getElementById("found").innerHTML=0;

document.getElementById("time").innerHTML=0;



let list=data[level];



cards=[];



list.forEach((item,index)=>{


cards.push({

...item,

id:index

});


cards.push({

...item,

id:index

});


});



cards=shuffle(cards);



draw();



timer=setInterval(()=>{


time++;


document.getElementById("time").innerHTML=time;


},1000);



}






function shuffle(arr){

return arr.sort(()=>Math.random()-0.5);

}





// ================================
// 建立牌面
// ================================


function draw(){


const board=document.getElementById("board");


board.innerHTML="";



cards.forEach(card=>{


let div=document.createElement("div");


div.className="memory-card";



div.innerHTML=`

<div class="cover">
❓
</div>


<div class="content">

<div class="icon">
${card.icon}
</div>


<div class="name">
${card.name}
</div>


</div>

`;



div.onclick=()=>flip(div,card);



board.appendChild(div);


});


}







function flip(cardElement,card){



if(lock)
return;


if(cardElement.classList.contains("open"))
return;


cardElement.classList.add("open");



if(!first){


first={

element:cardElement,

card:card

};


return;


}



second={

element:cardElement,

card:card

};



check();


}






function check(){



if(first.card.id===second.card.id){



first.element.classList.add("match");

second.element.classList.add("match");



found++;

score+=10;


document.getElementById("found")
.innerHTML=found;


document.getElementById("score")
.innerHTML=score;



showLesson(first.card);



first=null;

second=null;



if(found===cards.length/2){

finish();

}


}



else{


lock=true;



setTimeout(()=>{


first.element.classList.remove("open");

second.element.classList.remove("open");


first=null;

second=null;


lock=false;


},800);


}



}








// ================================
// 教學提示
// ================================


function showLesson(card){


document.getElementById("lesson")
.innerHTML=

`

<div class="lesson">

🎉 找到了！

<br><br>

<b>
${card.name}
</b>


<br><br>


${card.lesson}


<br><br>


📖 ${card.verse}


</div>


`;

}



function finish(){


clearInterval(timer);



document.getElementById("game")
.classList.add("hidden");


document.getElementById("result")
.classList.remove("hidden");



document.getElementById("finalText")
.innerHTML=

`

🎊 太棒了！

<br><br>

你完成了撒迦利亞書1-8章異象探索。

乃是倚靠我的靈。」

<br><br>

撒迦利亞書4:6

`;



}

}

.classList.remove("hidden");
