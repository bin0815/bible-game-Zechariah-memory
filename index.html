.memory-card{

}



.card-inner{


width:100%;

height:100%;

transition:.6s;


transform-style:preserve-3d;


}



.memory-card.open .card-inner{


transform:rotateY(180deg);


}



.card-front,
.card-back{


position:absolute;


width:100%;

height:100%;


border-radius:18px;


display:flex;


align-items:center;


justify-content:center;


flex-direction:column;


backface-visibility:hidden;


font-size:clamp(14px,3vw,22px);


}




.card-front{


background:#1565c0;

color:white;


font-size:clamp(35px,8vw,70px);


}




.card-back{


background:white;


border:3px solid #ffca28;


transform:rotateY(180deg);


}



.card-back .pic{


font-size:clamp(35px,8vw,70px);

}



.card-back .name{


font-size:clamp(12px,3vw,20px);

margin-top:5px;


}



.match .card-back{


background:#c8e6c9;


animation:shine .8s;


}



@keyframes shine{


50%{

transform:scale(1.1);

}


}

font-size:18px;

// ===============================
// 遊戲變數
// ===============================


let currentLevel="easy";

let cards=[];

let first=null;

let second=null;

let lock=false;


let score=0;

let found=0;

let timer=0;

let timerID;




// ===============================
// 開始遊戲
// ===============================


function startGame(level){


currentLevel=level;


document.getElementById("home")
.style.display="none";


document.getElementById("game")
.style.display="block";



createGame();



}







function createGame(){



clearInterval(timerID);



score=0;

found=0;

timer=0;


document.getElementById("score").innerHTML=0;

document.getElementById("found").innerHTML=0;

document.getElementById("time").innerHTML=0;



let source=bibleData[currentLevel];



let selected=[...source];



let pair=[];



selected.forEach((item,index)=>{


// 兩張完全相同圖片


pair.push({

id:index,

icon:item.icon,

name:item.name,

lesson:item.lesson,

verse:item.verse

});


pair.push({

id:index,

icon:item.icon,

name:item.name,

lesson:item.lesson,

verse:item.verse

});


});



cards=shuffle(pair);



drawCards();



timerID=setInterval(()=>{


timer++;

document.getElementById("time").innerHTML=timer;


},1000);



}








function shuffle(array){


return array.sort(()=>Math.random()-0.5);


}







// ===============================
// 建立卡牌
// ===============================


function drawCards(){


let board=document.getElementById("board");


board.innerHTML="";



let count=cards.length;



if(count<=12){

board.style.gridTemplateColumns="repeat(3,1fr)";

}

else if(count<=20){

board.style.gridTemplateColumns="repeat(4,1fr)";

}

else{

board.style.gridTemplateColumns="repeat(5,1fr)";

}





cards.forEach(card=>{


let div=document.createElement("div");


div.className="memory-card";



div.innerHTML=`

<div class="card-inner">


<div class="card-front">

❓

</div>


<div class="card-back">


<div class="pic">

${card.icon}

</div>


<div class="name">

${card.name}

</div>


</div>


</div>

`;




div.onclick=function(){

flip(div,card);

};



board.appendChild(div);



});


}









function flip(element,card){


if(lock)
return;


if(element.classList.contains("open"))
return;



element.classList.add("open");



if(!first){


first={element,card};

return;


}



second={element,card};


check();


}








function check(){



if(first.card.id===second.card.id){



first.element.classList.add("match");

second.element.classList.add("match");



score+=10;

found++;


document.getElementById("score").innerHTML=score;

document.getElementById("found").innerHTML=found;



showLesson(first.card);



first=null;

second=null;



if(found===cards.length/2){


finish();


}



}



else{


lock=true;



setTimeout(()=>{


first.element.classList.remove("open");

second.element.classList.remove("open");

first=null;

second=null;


lock=false;


},900);



}



}








// ===============================
// 教學提示
// ===============================


function showLesson(card){



document.getElementById("lesson")
.innerHTML=

`

<div class="lesson">

✨ 配對成功！

<br><br>

<b>${card.name}</b>

<br><br>

${card.lesson}

<br><br>

📖 ${card.verse}

</div>

`;



}








function finish(){


clearInterval(timerID);



document.getElementById("game")
.style.display="none";


document.getElementById("result")
.style.display="block";



document.getElementById("finalLesson")
.innerHTML=

`

🏆 你完成撒迦利亞異象探索！

<br><br>

📖 金句：

<br>

「不是倚靠勢力，不是倚靠才能，

乃是倚靠我的靈。」

<br><br>

撒迦利亞書4:6

`;



}







function restart(){


createGame();


}




function backHome(){


document.getElementById("result")
.style.display="none";


document.getElementById("home")
.style.display="block";


}
